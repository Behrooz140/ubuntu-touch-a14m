name: "گزارش باگ سختافزاری"
description: "یک مشکل مربوط به یک سختافزار خاص (یک سطر از ماتریس وضعیت)"
title: "[area] خلاصهٔ مشکل"
labels: ["bug", "needs-log"]
body:
  - type: markdown
    attributes:
      value: |
        قبل از باز کردن issue، [ماتریس سختافزار](../../docs/hardware-matrix.md)
        و [قواعد ثبت باگ](../../docs/bug-triage.md) را بخوان. هر سختافزار
        حداکثر یک issue باز دارد.
  - type: dropdown
    id: area
    attributes:
      label: "سختافزار"
      options:
        - boot
        - display
        - touch
        - gpu
        - wifi
        - bluetooth
        - audio
        - modem
        - camera
        - gps
        - sensors
        - fingerprint
        - usb
        - sdcard
        - battery
    validations:
      required: true
  - type: input
    id: build
    attributes:
      label: "شماره بیلد"
      placeholder: "build-01"
    validations:
      required: true
  - type: input
    id: base
    attributes:
      label: "بیلد اندروید/vendor مبنا"
      placeholder: "A145PXXUEDZJ2"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: "مراحل تولید"
      description: "دقیق، قابل تکرار، بدون اطلاعات شخصی"
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: "رفتار مورد انتظار"
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: "رفتار واقعی"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: "لینک لاگها"
      description: "نام آرشیو + SHA256، یا لینک به Release/Artifact"
    validations:
      required: true
  - type: checkboxes
    id: checklist
    attributes:
      label: "چکلیست"
      options:
        - label: "اطلاعات شخصی (IMSI/شماره/ایمیل) پاک شدهاند"
          required: true
        - label: "همان بیلد چند بار تست شده است"
          required: true
