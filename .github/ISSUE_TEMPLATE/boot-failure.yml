name: "بوت ناموفق"
description: "گوشی بالا نمیآید، لوگوی سامسونگ میماند یا ریبوت میشود"
title: "[boot] توضیح کوتاه"
labels: ["area:boot", "needs-log"]
body:
  - type: input
    id: build
    attributes:
      label: "شماره بیلد / Artifact"
      placeholder: "build-01"
    validations:
      required: true
  - type: dropdown
    id: symptom
    attributes:
      label: "علامت"
      options:
        - "لوگوی سامسونگ و ریبوت"
        - "صفحهٔ سیاه، بدون تاچ"
        - "لوپ بوت"
        - "بالا آمدن TWRP به جای UT"
        - "پانیک کرنل / dmesg"
        - "سایر"
    validations:
      required: true
  - type: textarea
    id: dmesg
    attributes:
      label: "آخرین خطوط dmesg / pstore"
      description: "همانطور که هستند paste کن، آنها را خلاصه نکن"
      render: shell
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: "وضعیت قبل از فلش"
      description: "نسخهٔ اندروید، وضعیت vbmeta، TWRP، آخرین بیلد کاری"
    validations:
      required: true
